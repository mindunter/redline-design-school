<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Redline Design School: a free, self-paced product design course with 27 lessons, practice briefs, quizzes and reference images.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Redline Design School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a designer's spec sheet. Curriculum rail on the left, lesson canvas on the right; redline magenta marks measurements, progress and the one thing to do next. */
:root{
  --paper:#F6F7F9; --surface:#FFFFFF; --ink:#15171D; --muted:#5A6070; --line:#DCDFE7; --grid:rgba(36,48,90,.06);
  --red:#D9145A; --red-soft:rgba(217,20,90,.09); --ok:#13805A; --ok-soft:rgba(19,128,90,.1); --bad:#B4321F; --bad-soft:rgba(180,50,31,.09);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --rail:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101217; --surface:#171A21; --ink:#E8EAF0; --muted:#9BA1B0; --line:#2A2F3A; --grid:rgba(160,175,220,.06);
  --red:#FF4F8E; --red-soft:rgba(255,79,142,.12); --ok:#46C493; --ok-soft:rgba(70,196,147,.12); --bad:#FF7A63; --bad-soft:rgba(255,122,99,.12); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#101217; --surface:#171A21; --ink:#E8EAF0; --muted:#9BA1B0; --line:#2A2F3A; --grid:rgba(160,175,220,.06);
  --red:#FF4F8E; --red-soft:rgba(255,79,142,.12); --ok:#46C493; --ok-soft:rgba(70,196,147,.12); --bad:#FF7A63; --bad-soft:rgba(255,122,99,.12); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:30px;height:30px;border:1.5px solid var(--ink);position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:1.5px solid var(--red)}
.brand-mark::after{content:"";position:absolute;top:-6px;bottom:-6px;left:50%;border-left:1.5px solid var(--red)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.db i{background:var(--ok)}
.navhome{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600}
.navhome[aria-current="page"]{background:var(--red-soft);color:var(--red)}
.mod{display:flex;flex-direction:column;gap:2px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 10px 4px}
.mod-h span:first-child{font-weight:600;font-size:14px}
.lnk{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.35}
.lnk:hover{background:var(--paper);color:var(--ink)}
.lnk[aria-current="page"]{background:var(--red-soft);color:var(--ink)}
.dot{width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center}
.lnk.done .dot{border-color:var(--ok);background:var(--ok)}
.lnk.done .dot::after{content:"";width:5px;height:3px;border-left:1.5px solid var(--surface);border-bottom:1.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.lnk[aria-current="page"] .dot{border-color:var(--red)}

main{min-width:0;padding-block:28px 64px;padding-left:clamp(16px,4vw,56px);padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.topbar{display:none}

/* home hero */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:40px clamp(20px,4vw,44px) 32px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px;overflow:hidden}
.hero h1{font-size:clamp(36px,6.4vw,64px);font-weight:800;letter-spacing:-.03em;max-width:13ch;position:relative}
.hero h1 em{font-style:normal;color:var(--red)}
.spec{position:absolute;font-family:var(--f-mono);font-size:11px;color:var(--red);display:flex;align-items:center;gap:6px;white-space:nowrap}
.spec-v{right:-4px;top:4px;bottom:4px;flex-direction:column;justify-content:center;width:24px}
.spec-v::before,.spec-v::after{content:"";flex:1;border-left:1px solid var(--red)}
.hero-inner{display:flex;flex-direction:column;gap:18px;max-width:600px}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:54ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:4px;padding:11px 18px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--ink)}
.btn.primary:hover{border-color:var(--red)}

/* ruler progress */
.ruler{display:flex;flex-direction:column;gap:8px}
.ruler-top{display:flex;justify-content:space-between;gap:12px}
.ruler-bar{position:relative;height:22px;border:1px solid var(--line);background:var(--surface);border-radius:2px;overflow:hidden}
.ruler-fill{position:absolute;inset:0 auto 0 0;background:var(--red-soft);border-right:2px solid var(--red);transition:width .4s ease}
.ruler-ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/27));mask:linear-gradient(to bottom,#000 40%,transparent 40%)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.section-h h2{font-size:24px;font-weight:700}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.modcard:hover{border-color:var(--red)}
.modcard h3{font-size:19px;font-weight:700}
.modcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;flex:1}
.pips{display:flex;gap:4px}
.pips i{height:4px;flex:1;background:var(--line);border-radius:1px}
.pips i.on{background:var(--ok)}
.modcard-f{display:flex;justify-content:space-between;color:var(--muted)}

/* lesson */
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--red)}
.lhead{display:flex;flex-direction:column;gap:14px}
.lhead h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.025em}
.lmeta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:3px;background:var(--ok-soft);color:var(--ok);font-family:var(--f-mono);font-size:11.5px}
.prose{max-width:66ch;font-size:17px}
.prose p{margin:0 0 1em}
.prose h3{font-size:21px;font-weight:700;margin:1.6em 0 .6em}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1em}
.prose li{margin-bottom:.4em}
.prose strong{font-weight:600}
.prose .term{font-family:var(--f-mono);font-size:.82em;background:var(--red-soft);color:var(--red);padding:1px 5px;border-radius:3px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.block-h h2{font-size:20px;font-weight:700}
.keys{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.keys li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:baseline}
.keys li::before{content:"→";color:var(--red);font-family:var(--f-mono)}
.brief{border-left:2px solid var(--red);padding-left:16px;margin:0}
.brief p{margin:0 0 .6em}
.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--ok)}

.q{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q-t{font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper);display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:15px;color:var(--muted);margin:0}
.score{font-family:var(--f-mono);font-size:13px}

textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
textarea:focus{outline:none;border-color:var(--red)}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res a{text-decoration:none;font-weight:500}
.res a:hover{text-decoration:underline}
.res span{color:var(--muted);font-size:14px}

.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--red)}
.pager a:last-child{text-align:right}
.pager a b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donebtn.is-done{background:var(--ok);border-color:var(--ok);color:#fff}

/* reference images */
.fig{margin:0;display:flex;flex-direction:column;gap:8px}
.fig button{padding:0;border:1px solid var(--line);border-radius:4px;background:#F6F7F9;overflow:hidden;cursor:zoom-in;display:block}
.fig img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}
.fig figcaption{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px}
.fig figcaption .mono{color:var(--red);flex:none}
.figs{display:grid;gap:20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gallery a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.4}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#F6F7F9;display:block}
.gallery a:hover img{border-color:var(--red)}
.gallery span{color:var(--muted)}
dialog.zoom{border:0;padding:0;background:transparent;max-width:min(1400px,96vw);width:100%}
dialog.zoom::backdrop{background:rgba(10,12,18,.82)}
dialog.zoom img{width:100%;height:auto;display:block;border-radius:4px}
dialog.zoom p{color:#fff;margin:10px 2px 0;font-size:14px;display:flex;justify-content:space-between;gap:12px}
dialog.zoom button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:4px 10px}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:20;left:0;top:0;bottom:0;height:auto;width:min(320px,86vw);transform:translateX(-102%);transition:transform .25s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app.open .rail{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(10,12,18,.45)}
  .topbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .btn{padding:7px 12px}
  main{padding-top:20px}
  .spec-v{display:none}
  .stats{grid-template-columns:minmax(0,1fr)}
  .pager{grid-template-columns:1fr 1fr}
  .pager .donebtn{grid-column:1/-1;grid-row:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <button class="btn" id="menuBtn" aria-controls="rail" aria-expanded="false">Lessons</button>

<script>
/* ───────── Curriculum ───────── */
const COURSE = [
{ id:"foundations", title:"Foundations", blurb:"What a product designer actually does, and the process that keeps work honest.", lessons:[
 { id:"what-is-product-design", title:"What product designers do", mins:8,
   body:`<p>A product designer decides what a product should do, how it should work and how it should look, then proves those decisions with evidence. The job sits where three questions meet: <strong>Is it valuable to users?</strong> <strong>Is it viable for the business?</strong> <strong>Is it feasible to build?</strong></p>
<p>That is why the role is broader than "making screens". On a given week you might run user interviews, sketch twenty flows on paper, argue for cutting a feature, tighten the spacing on a settings page and sit with an engineer to work out an edge case.</p>
<h3>Product, UX and UI</h3>
<p><span class="term">UX</span> covers the whole experience: research, flows, structure. <span class="term">UI</span> is the visual and interactive surface: type, color, components. <span class="term">Product design</span> includes both and adds ownership of outcomes, meaning you care whether the shipped thing moved a metric, not only whether it looked right in Figma.</p>
<h3>The core loop</h3>
<p>Every good designer repeats the same loop at different speeds: <strong>understand → define → explore → decide → test → ship → learn</strong>. Skipping steps feels fast and usually costs a redesign later.</p>`,
   keys:["Product design = value × viability × feasibility.","UI is part of the job; owning the outcome is the rest of it.","The loop is understand, define, explore, decide, test, ship, learn."],
   practice:`<p>Pick an app you use every day. Write one paragraph each answering: who it is for, what problem it solves, how it makes money, and one thing you suspect was hard to build.</p><p>This is the habit of looking at products through all three lenses.</p>`,
   quiz:[{q:"Which question is specifically about feasibility?",o:["Will people pay for it?","Can the team build it with the time and tech available?","Do users understand the navigation?","Does the color palette fit the brand?"],a:1,w:"Feasibility is about engineering effort, constraints and technology."},
          {q:"What separates product design from pure UI design?",o:["Using Figma instead of Sketch","Ownership of the outcome, not only the visuals","Designing for mobile","Writing code"],a:1,w:"Product designers are accountable for whether the work solves the problem and moves the metric."}],
   res:[["NN/g: The Definition of User Experience (UX)","https://www.nngroup.com/articles/definition-user-experience/"],["Julie Zhuo, The Making of a Manager (design leadership)","https://www.juliezhuo.com/book/manager.html"]]},
 { id:"double-diamond", title:"Design thinking and the Double Diamond", mins:7,
   body:`<p>The Double Diamond, from the UK Design Council, maps the design process as two rounds of <strong>diverging</strong> (opening up options) and <strong>converging</strong> (narrowing to a decision).</p>
<ol><li><strong>Discover</strong> (diverge): research the problem space. Talk to people, look at data, study competitors.</li>
<li><strong>Define</strong> (converge): turn findings into a clear problem statement.</li>
<li><strong>Develop</strong> (diverge): generate many possible solutions.</li>
<li><strong>Deliver</strong> (converge): test, refine and ship the best one.</li></ol>
<p>The first diamond is about <em>designing the right thing</em>. The second is about <em>designing the thing right</em>. Most beginner mistakes happen when someone jumps straight into diamond two with a solution they already had in mind.</p>
<h3>In real teams</h3>
<p>The diamonds are rarely linear. You might find in testing (deliver) that you misunderstood the problem and loop back to discover. That is the process working, not failing.</p>`,
   keys:["Diverge to see options, converge to make a decision.","Diamond one: the right problem. Diamond two: the right solution.","Looping back is normal and healthy."],
   practice:`<p>Take a small annoyance from your life (for example, splitting bills with roommates). Spend 10 minutes listing every way the problem shows up (diverge), then circle the one that matters most and write it as one sentence (converge).</p>`,
   quiz:[{q:"Which phase produces a clear problem statement?",o:["Discover","Define","Develop","Deliver"],a:1,w:"Define converges research into a focused problem."},
          {q:"A designer opens Figma on day one with a solution in mind. Which diamond did they skip?",o:["The first","The second","Neither","Both"],a:0,w:"They skipped discovering and defining the problem."}],
   res:[["Design Council: The Double Diamond","https://www.designcouncil.org.uk/resources/the-double-diamond/"]]},
 { id:"tools-of-the-trade", title:"Tools and working setup", mins:6,
   body:`<p>Tools change; principles do not. Still, you need a working kit.</p>
<ul><li><strong>Paper and a thick marker.</strong> The fastest prototyping tool. A thick pen stops you from fussing over detail too early.</li>
<li><strong>Figma.</strong> The industry standard for interface design, prototyping and design systems. Learn frames, auto layout, components and variants first.</li>
<li><strong>A whiteboard tool</strong> (FigJam, Miro) for research synthesis, journey maps and workshops.</li>
<li><strong>A notes system</strong> for interview notes and decisions. Your future case study depends on it.</li></ul>
<h3>Learn the tool through projects</h3>
<p>Tutorials teach buttons; projects teach judgment. Use each lesson's practice brief here as the project, and learn the Figma feature you need when you need it.</p>`,
   keys:["Sketch on paper before opening Figma.","Figma priorities: frames, auto layout, components, variants.","Keep decision notes; they become your case study."],
   practice:`<p>Set up a Figma file named "Redline practice" with one page per module. Recreate the home screen of your daily app from the first lesson using frames and auto layout. Don't worry about pixel accuracy yet.</p>`,
   quiz:[{q:"Why sketch with a thick marker?",o:["It looks better in a portfolio","It stops you from obsessing over detail too early","Clients prefer it","It is required by design thinking"],a:1,w:"Low fidelity keeps attention on structure and flow."}],
   res:[["Figma Learn: Get started","https://help.figma.com/hc/en-us/categories/360002051613"],["Figma auto layout guide","https://help.figma.com/hc/en-us/articles/360040451373"]]}
]},
{ id:"research", title:"User Research", blurb:"Learn what people actually do and need, not what they say they want.", lessons:[
 { id:"user-interviews", title:"Running user interviews", mins:10,
   body:`<p>Interviews are the backbone of qualitative research. The goal is to understand people's behavior, context and motivations, not to ask them to design your product.</p>
<h3>Good questions</h3>
<ul><li>Ask about <strong>past behavior</strong>: "Tell me about the last time you…" beats "Would you use…?"</li>
<li>Keep questions <strong>open</strong>: start with how, what, why, tell me about.</li>
<li>Avoid <strong>leading</strong>: "How frustrating is checkout?" assumes frustration. Try "Walk me through your last checkout."</li>
<li>Follow up with <strong>"Why?"</strong> and <strong>"What happened next?"</strong> Most insight lives in the second and third answer.</li></ul>
<h3>Logistics</h3>
<p>Five to eight interviews per user group usually reveal the main patterns. Keep sessions to 30–45 minutes, get consent to record, and have a second person take notes so you can listen.</p>
<p>People are poor at predicting their future behavior and good at describing their past. Design your questions around that.</p>`,
   keys:["Ask about the last time, not hypotheticals.","Open, neutral questions; follow up with why.","5–8 interviews per segment surface most patterns."],
   practice:`<p>Interview two people about how they plan meals for the week. Write a 6-question script first, every question about past behavior. Record (with consent) or take notes, then list the three most surprising things you heard.</p>`,
   quiz:[{q:"Which is the best interview question?",o:["Would you use an app that plans meals?","Don't you hate planning meals?","Tell me about the last time you decided what to cook.","What features should a meal app have?"],a:2,w:"It asks about specific past behavior without leading."},
          {q:"Why ask about past behavior?",o:["It is faster","People describe the past more accurately than they predict the future","It flatters the participant","It avoids legal issues"],a:1,w:"Self-predictions are unreliable; stories from the past are concrete."}],
   res:[["Erika Hall, Just Enough Research","https://abookapart.com/products/just-enough-research"],["Rob Fitzpatrick, The Mom Test","https://www.momtestbook.com/"]]},
 { id:"personas-jtbd", title:"Personas and Jobs to Be Done", mins:8,
   body:`<p>Research is only useful if the team remembers it. Personas and Jobs to Be Done (JTBD) are two ways to package it.</p>
<h3>Personas</h3>
<p>A persona is an archetype built from real research: goals, behaviors, frustrations and context. A good one changes decisions ("Priya checks this on a train with spotty signal, so offline matters"). A bad one is a stock photo with a made-up hobby.</p>
<h3>Jobs to Be Done</h3>
<p>JTBD focuses on the progress a person is trying to make. The classic format:</p>
<p><strong>When</strong> [situation], <strong>I want to</strong> [motivation], <strong>so I can</strong> [expected outcome].</p>
<p>"When I get home tired on a weekday, I want to decide dinner in under a minute, so I can avoid ordering takeout again." Notice it says nothing about apps. It describes the job, which leaves room for better solutions.</p>`,
   keys:["Personas must come from research and change decisions.","JTBD: When…, I want to…, so I can…","Jobs are solution-free; that is their power."],
   practice:`<p>From your two meal-planning interviews, write one persona (goals, behaviors, frustrations, context) and three job stories. Cross out any detail that would not change a design decision.</p>`,
   quiz:[{q:"What makes a persona useful?",o:["A realistic photo","A detailed hobby list","It is based on research and changes design decisions","It has a memorable name"],a:2,w:"Personas exist to guide decisions; decoration does not."},
          {q:"Which is a proper job story?",o:["As a user, I want a button","When I'm rushing to a meeting, I want to see my next stop instantly, so I can leave on time","Add dark mode","Users like fast apps"],a:1,w:"It names situation, motivation and outcome."}],
   res:[["Intercom: Designing features using job stories","https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/"],["NN/g: Personas make users memorable","https://www.nngroup.com/articles/persona/"]]},
 { id:"synthesis", title:"Synthesis and affinity mapping", mins:8,
   body:`<p>Synthesis turns a pile of notes into insight. Affinity mapping is the standard method.</p>
<ol><li>Write each observation on its own sticky: one fact, quote or behavior per note.</li>
<li>Put all stickies on a board without categories.</li>
<li>Group by similarity, bottom-up. Let themes emerge rather than starting with headers.</li>
<li>Name each group with a statement, not a label: "People plan meals around what's about to expire" beats "Food waste".</li>
<li>Turn the strongest themes into <strong>insights</strong>: an observation plus why it matters.</li></ol>
<h3>Observation vs. insight</h3>
<p><strong>Observation:</strong> 4 of 6 people screenshot recipes. <strong>Insight:</strong> people collect recipes in places they never return to, so saving is easy but finding again is broken. The insight points at an opportunity.</p>`,
   keys:["One observation per sticky.","Group bottom-up; name groups as statements.","Insight = observation + why it matters."],
   practice:`<p>Put every note from your interviews on a FigJam board as stickies. Affinity-map them and write three insights in the observation + implication format.</p>`,
   quiz:[{q:"Which is an insight rather than an observation?",o:["Users click the blue button","3 of 5 people abandoned the form","People abandon the form at the address step because they don't have their postcode handy, so we ask too early","The form has 8 fields"],a:2,w:"It explains why and implies what to do."}],
   res:[["NN/g: Affinity diagramming","https://www.nngroup.com/articles/affinity-diagram/"]]}
]},
{ id:"strategy", title:"Problem Framing & Strategy", blurb:"Frame the problem, choose how to measure success, and decide what to build first.", lessons:[
 { id:"problem-statements", title:"Problem statements and HMW", mins:7,
   body:`<p>A well-framed problem is half the solution. A problem statement names <strong>who</strong> has the problem, <strong>what</strong> it is, and <strong>why</strong> it matters, grounded in research.</p>
<p><em>Busy parents who cook on weeknights (who) can't decide what to make with what they have (what), so they waste food and fall back on takeout (why).</em></p>
<h3>How Might We</h3>
<p>Turn the problem into "How might we…" questions to open up ideation. Scope matters:</p>
<ul><li>Too broad: "How might we fix dinner?"</li>
<li>Too narrow: "How might we add a fridge-scanning button?" (that is a solution)</li>
<li>Just right: "How might we help parents decide dinner from what's already in the fridge?"</li></ul>`,
   keys:["Problem = who + what + why, from research.","HMW questions open up ideas.","A HMW containing a solution is too narrow."],
   practice:`<p>Write one problem statement from your meal-planning insights, then five HMW questions at different scopes. Mark which is too broad, too narrow and just right.</p>`,
   quiz:[{q:"Which HMW is scoped well?",o:["How might we improve food?","How might we add a barcode scanner?","How might we help commuters know if their train is late before leaving home?","How might we use AI?"],a:2,w:"It is specific about who and the need, but leaves the solution open."}],
   res:[["NN/g: Using How Might We questions","https://www.nngroup.com/articles/how-might-we-questions/"]]},
 { id:"metrics", title:"Measuring success", mins:8,
   body:`<p>If you can't say how you'll know the design worked, you can't defend it. Agree on metrics before designing.</p>
<h3>Google's HEART framework</h3>
<ul><li><strong>Happiness:</strong> satisfaction, NPS, ratings.</li>
<li><strong>Engagement:</strong> how often and how deeply people use it.</li>
<li><strong>Adoption:</strong> new users of a product or feature.</li>
<li><strong>Retention:</strong> who comes back.</li>
<li><strong>Task success:</strong> completion rate, time on task, error rate.</li></ul>
<p>For each, use <strong>Goals → Signals → Metrics</strong>: what you want, what behavior shows it, how you count it.</p>
<p>Pair a metric you want to move with a <span class="term">guardrail</span> you must not hurt. Speeding up checkout is good unless refunds go up.</p>`,
   keys:["Set metrics before you design.","HEART: Happiness, Engagement, Adoption, Retention, Task success.","Every target metric needs a guardrail."],
   practice:`<p>For your meal-planning idea, fill a HEART table for two categories you care about most: goal, signal, metric. Add one guardrail metric.</p>`,
   quiz:[{q:"Time to complete checkout falls under which HEART category?",o:["Happiness","Adoption","Retention","Task success"],a:3,w:"Time on task is a task success measure."},
          {q:"What is a guardrail metric?",o:["A metric you must not make worse while improving another","The most important KPI","A vanity metric","A metric for security"],a:0,w:"Guardrails protect against wins that cause hidden harm."}],
   res:[["Google: HEART framework paper","https://research.google/pubs/measuring-the-user-experience-on-a-large-scale-user-centered-metrics-for-web-applications/"]]},
 { id:"prioritization", title:"Prioritization", mins:7,
   body:`<p>There are always more ideas than time. Prioritization frameworks make trade-offs visible so the team can argue about the inputs instead of opinions.</p>
<h3>Impact / Effort matrix</h3>
<p>Plot ideas on two axes. Do <strong>quick wins</strong> (high impact, low effort) first, plan <strong>big bets</strong>, and question everything in the low-impact corner.</p>
<h3>RICE</h3>
<p>Score = <strong>Reach × Impact × Confidence ÷ Effort</strong>. Reach is people per period, Impact is a 0.25–3 scale, Confidence is a percentage, Effort is person-months. Low confidence is a signal to do more research, not to guess higher.</p>
<h3>MVP thinking</h3>
<p>Find the smallest version that tests your riskiest assumption. An MVP is a learning tool, not a smaller final product.</p>`,
   keys:["Make trade-offs explicit.","RICE = Reach × Impact × Confidence ÷ Effort.","An MVP tests the riskiest assumption."],
   practice:`<p>List eight feature ideas for meal planning. Score each with RICE in a simple table, then plot them on an impact/effort matrix. Do both methods agree?</p>`,
   quiz:[{q:"Reach 500, Impact 2, Confidence 80%, Effort 4. What is the RICE score?",o:["200","250","400","1000"],a:0,w:"500 × 2 × 0.8 ÷ 4 = 200."}],
   res:[["Intercom: RICE prioritization","https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/"]]}
]},
{ id:"structure", title:"Information Architecture & Flows", blurb:"Organize content, map journeys and sketch the skeleton before the skin.", lessons:[
 { id:"information-architecture", title:"Information architecture", mins:8,
   body:`<p>Information architecture (IA) is how content is organized, labeled and connected so people can find things. Good IA is invisible; bad IA shows up as "Where is…?"</p>
<h3>Core pieces</h3>
<ul><li><strong>Organization:</strong> how items are grouped (by task, audience, topic, time).</li>
<li><strong>Labeling:</strong> the words used. Use the user's vocabulary, not internal jargon.</li>
<li><strong>Navigation:</strong> how people move between groups.</li>
<li><strong>Search:</strong> the fallback when browsing fails.</li></ul>
<h3>Card sorting and tree testing</h3>
<p>In an <strong>open card sort</strong>, users group items and name the groups, which shows their mental model. In a <strong>tree test</strong>, users find items in your proposed text-only hierarchy, which validates it before any visual design.</p>`,
   keys:["IA = organization, labeling, navigation, search.","Label with users' words.","Card sort to learn mental models; tree test to validate."],
   practice:`<p>List 25 things a meal-planning app could contain. Ask two people to group them on paper (open card sort). Compare their groupings and draft a sitemap.</p>`,
   quiz:[{q:"Which method validates a proposed hierarchy without visuals?",o:["Open card sort","Tree test","A/B test","Heatmap"],a:1,w:"Tree testing checks findability in a text-only structure."}],
   res:[["Abby Covert, How to Make Sense of Any Mess","https://www.howtomakesenseofanymess.com/"],["NN/g: Tree testing","https://www.nngroup.com/articles/tree-testing/"]]},
 { id:"user-flows", title:"User flows and journey maps", mins:7,
   body:`<p>A <strong>user flow</strong> maps the steps a person takes to complete one task: screens, decisions and outcomes. A <strong>journey map</strong> zooms out to the whole experience over time, including emotions and moments outside the product.</p>
<h3>Drawing a flow</h3>
<ul><li>Start with an entry point and end with a clear success state.</li>
<li>Use rectangles for screens, diamonds for decisions.</li>
<li>Draw the <strong>unhappy paths</strong>: wrong password, no results, lost connection. That is where most real design work lives.</li></ul>
<p>Count the steps. Every step is a chance to drop off, so ask of each one: can we remove it, merge it or defer it?</p>`,
   keys:["Flows = one task; journeys = the whole experience.","Always draw the unhappy paths.","Every step is a drop-off risk."],
   practice:`<p>Draw the flow for "plan this week's dinners" from app open to saved plan. Include at least three unhappy paths. Then cut one step.</p>`,
   quiz:[{q:"What does a journey map include that a user flow usually doesn't?",o:["Screens","Emotions and offline moments over time","Buttons","Error states"],a:1,w:"Journey maps capture the wider experience and feelings."}],
   res:[["NN/g: Journey mapping 101","https://www.nngroup.com/articles/journey-mapping-101/"]]},
 { id:"wireframing", title:"Wireframing", mins:7,
   body:`<p>Wireframes define structure and hierarchy without visual polish: what is on the screen, in what order, at what importance.</p>
<h3>Fidelity ladder</h3>
<ol><li><strong>Sketches</strong>: minutes each, many variants.</li>
<li><strong>Low-fi wireframes</strong>: grey boxes and real headlines.</li>
<li><strong>Mid-fi</strong>: real content, real layout, still greyscale.</li></ol>
<p>Use <strong>real content</strong> early. Lorem ipsum hides problems: the real product name is longer, the real list has 47 items, the real error message needs two lines.</p>
<p>Try <strong>Crazy 8s</strong>: fold a sheet into eight panels and sketch eight different versions of one screen in eight minutes. The first three are obvious; the interesting ones come after.</p>`,
   keys:["Wireframes are about hierarchy, not style.","Real content exposes real problems.","Crazy 8s pushes past your first idea."],
   practice:`<p>Do a Crazy 8s for the weekly plan screen. Pick the strongest two and turn them into mid-fi wireframes in Figma with real recipe names.</p>`,
   quiz:[{q:"Why avoid lorem ipsum in wireframes?",o:["It is copyrighted","It hides real length and content problems","Clients dislike Latin","Figma doesn't support it"],a:1,w:"Real content reveals layout issues early."}],
   res:[["Open Practice Library: Crazy 8s","https://openpracticelibrary.com/practice/crazy-8s/"]]}
]},
{ id:"interaction", title:"Interaction Design", blurb:"The laws, patterns and states that make an interface feel effortless.", lessons:[
 { id:"laws-of-ux", title:"Laws of UX", mins:9,
   body:`<p>A handful of psychology findings explain why some interfaces feel easy.</p>
<ul><li><strong>Fitts's law:</strong> time to reach a target depends on its size and distance. Make primary actions big and close to where the hand or cursor already is.</li>
<li><strong>Hick's law:</strong> more choices mean slower decisions. Reduce, group or progressively reveal options.</li>
<li><strong>Jakob's law:</strong> people spend most time on other products and expect yours to work the same way. Use conventions unless you have a strong reason.</li>
<li><strong>Miller's law:</strong> working memory holds a handful of items. Chunk information (phone numbers are chunked for this reason).</li>
<li><strong>Doherty threshold:</strong> responses under about 400 ms keep people in flow. Show feedback instantly even if the work takes longer.</li></ul>`,
   keys:["Fitts: big, close targets.","Hick: fewer choices, faster decisions.","Jakob: follow conventions by default."],
   practice:`<p>Screenshot three screens from apps you use. Annotate each with one law it follows and one it breaks. Redesign one broken case as a quick sketch.</p>`,
   quiz:[{q:"A settings page with 40 toggles on one screen mainly breaks…",o:["Fitts's law","Hick's law","Doherty threshold","Jakob's law"],a:1,w:"Too many choices slow decisions."},
          {q:"Placing a mobile app's main action at the bottom of the screen applies…",o:["Fitts's law","Miller's law","Tesler's law","Pareto principle"],a:0,w:"The target is closer to the thumb."}],
   res:[["Laws of UX (Jon Yablonski)","https://lawsofux.com/"]]},
 { id:"affordance-feedback", title:"Affordances, signifiers and feedback", mins:7,
   body:`<p>Don Norman's ideas from <em>The Design of Everyday Things</em> are the grammar of interaction design.</p>
<ul><li><strong>Affordance:</strong> what an object lets you do (a button can be pressed).</li>
<li><strong>Signifier:</strong> the visible cue that tells you so (it looks raised, has a label, changes on hover).</li>
<li><strong>Feedback:</strong> the response that confirms the action happened (pressed state, toast, progress).</li>
<li><strong>Mapping:</strong> the relationship between controls and their effect (a slider moving right increases volume).</li></ul>
<p>A flat text link styled exactly like body copy has an affordance but no signifier. A button that does nothing visible for two seconds has no feedback, so people tap it again.</p>`,
   keys:["Affordance = what's possible; signifier = what tells you.","Every action needs immediate feedback.","Natural mapping reduces learning."],
   practice:`<p>Find five controls around your home or in an app that confuse people. For each, name what is missing: signifier, feedback or mapping. Sketch a fix for one.</p>`,
   quiz:[{q:"Users double-submit a form because nothing changes after the first click. What's missing?",o:["Affordance","Feedback","Mapping","Constraint"],a:1,w:"Without feedback, people repeat the action."}],
   res:[["Don Norman, The Design of Everyday Things","https://jnd.org/books/the-design-of-everyday-things-revised-and-expanded-edition/"]]},
 { id:"ui-states", title:"Designing every state", mins:7,
   body:`<p>Beginners design the ideal screen. Professionals design all of its states. Each screen typically needs:</p>
<ul><li><strong>Empty:</strong> first use. Explain what will appear and how to add the first item.</li>
<li><strong>Loading:</strong> skeletons for content, spinners only for short waits.</li>
<li><strong>Partial:</strong> one item, or a list that is only half full.</li>
<li><strong>Ideal:</strong> the screen you already drew.</li>
<li><strong>Error:</strong> say what went wrong and how to fix it, in plain language, without blame.</li>
<li><strong>Overflow:</strong> very long names, 1,000 items, huge numbers.</li></ul>
<p>Also design <strong>interactive states</strong> for every control: default, hover, focus, pressed, disabled, selected.</p>`,
   keys:["Empty, loading, partial, ideal, error, overflow.","Errors explain the fix without blame.","Controls need hover, focus, pressed, disabled."],
   practice:`<p>Take your weekly plan wireframe and design its empty, loading, error and overflow states. Write the real copy for the empty and error states.</p>`,
   quiz:[{q:"Which is the best error message?",o:["Error 402","Something went wrong","Your card was declined. Check the number or try another card.","Invalid input!"],a:2,w:"It says what happened and how to fix it."}],
   res:[["NN/g: Error message guidelines","https://www.nngroup.com/articles/error-message-guidelines/"]]}
]},
{ id:"visual", title:"Visual Design", blurb:"Typography, color and layout: the craft that makes hierarchy visible.", lessons:[
 { id:"typography", title:"Typography for interfaces", mins:9,
   body:`<p>Most of an interface is text, so typography carries most of the visual design.</p>
<h3>Type scale</h3>
<p>Pick a base size (16 px for body is a safe start) and a ratio, such as 1.25. That gives sizes like 16, 20, 25, 31, 39. Limit yourself to about five sizes; hierarchy comes from contrast, and too many sizes erase it.</p>
<h3>Rules that matter</h3>
<ul><li><strong>Line length:</strong> 45–75 characters per line for reading.</li>
<li><strong>Line height:</strong> about 1.4–1.6 for body, tighter (1.1–1.25) for large headings.</li>
<li><strong>Weight before size:</strong> try bold or color before making text bigger.</li>
<li><strong>Two families max:</strong> often one family with several weights is enough.</li></ul>`,
   keys:["Base size + ratio = type scale.","45–75 characters per line.","Use weight and color before size."],
   practice:`<p>Build a type scale in Figma as text styles (Display, H1, H2, Body, Caption). Apply it to your mid-fi weekly plan screen and remove any size outside the scale.</p>`,
   quiz:[{q:"With a 16 px base and a 1.25 ratio, the next size up is…",o:["18 px","20 px","24 px","32 px"],a:1,w:"16 × 1.25 = 20."}],
   res:[["Butterick's Practical Typography","https://practicaltypography.com/"],["Type Scale calculator","https://typescale.com/"]]},
 { id:"color", title:"Color and contrast", mins:8,
   body:`<p>Color in interfaces is a system with jobs, not decoration.</p>
<ul><li><strong>Neutrals</strong> (most of the UI): backgrounds, text, borders.</li>
<li><strong>Primary</strong>: brand and main actions. Use it sparingly so it stays meaningful.</li>
<li><strong>Semantic</strong>: success, warning, danger, info.</li></ul>
<p>Use the <strong>60-30-10</strong> rule as a starting point: 60% dominant neutral, 30% secondary, 10% accent.</p>
<h3>Contrast</h3>
<p>WCAG AA requires a contrast ratio of at least <strong>4.5:1</strong> for normal text and <strong>3:1</strong> for large text and UI components. Never rely on color alone to convey meaning; pair it with an icon or label for color-blind users.</p>
<p>Build tints and shades as a scale (for example 50–900) so you have consistent steps for hover states, backgrounds and borders.</p>`,
   keys:["Neutrals carry most of the UI.","AA: 4.5:1 text, 3:1 large text and UI parts.","Never use color as the only signal."],
   practice:`<p>Create a palette for your app: a neutral scale, one primary, four semantic colors. Check every text-on-background pair with a contrast checker and fix any that fail.</p>`,
   quiz:[{q:"Minimum WCAG AA contrast for normal body text?",o:["2:1","3:1","4.5:1","7:1"],a:2,w:"4.5:1 for normal text; 7:1 is AAA."}],
   res:[["WebAIM contrast checker","https://webaim.org/resources/contrastchecker/"],["Refactoring UI (book)","https://refactoringui.com/"]]},
 { id:"layout-spacing", title:"Layout, grids and spacing", mins:8,
   body:`<p>Consistent spacing is the fastest way to make a design look professional.</p>
<h3>The 8-point system</h3>
<p>Use multiples of 8 for spacing and sizing (8, 16, 24, 32, 48, 64), with 4 for tight spots. Most screen sizes divide by 8, and a constrained set of values speeds up decisions.</p>
<h3>Proximity and grouping</h3>
<p>Items closer together read as related. Space <em>between</em> groups should be clearly larger than space <em>within</em> them. This is the Gestalt principle of proximity, and it often replaces the need for borders and boxes.</p>
<h3>Grids</h3>
<p>A 12-column grid on desktop, 8 on tablet and 4 on mobile is a common starting point, with fixed gutters (16–24 px) and margins.</p>`,
   keys:["Space in multiples of 8.","Between-group space > within-group space.","12 / 8 / 4 column grids are a safe default."],
   practice:`<p>Redline your weekly plan screen: annotate every gap with its pixel value. Change any value that isn't on the 8-point scale and remove any border that proximity can replace.</p>`,
   quiz:[{q:"Which spacing set follows the 8-point system?",o:["5, 10, 15, 20","8, 16, 24, 32","6, 12, 18, 24","10, 20, 30, 40"],a:1,w:"All are multiples of 8."}],
   res:[["Material Design 3: Grids and spacing","https://m3.material.io/foundations/layout/grids-spacing/grids"],["Spec.fm: 8-point grid","https://spec.fm/specifics/8-pt-grid"]]}
]},
{ id:"systems", title:"Design Systems & Figma", blurb:"Components, tokens and handoff: designing at the scale real teams work.", lessons:[
 { id:"components-tokens", title:"Components and tokens", mins:8,
   body:`<p>A design system is the shared set of decisions, components and guidelines that let a team build consistently.</p>
<h3>Tokens</h3>
<p>Design tokens are named values: <span class="term">color.text.primary</span>, <span class="term">space.4</span>, <span class="term">radius.md</span>. Naming by <em>purpose</em> rather than value ("text.primary" instead of "gray-900") lets you change themes, such as dark mode, without touching components.</p>
<h3>Atomic design</h3>
<p>Brad Frost's model: <strong>atoms</strong> (button, input) → <strong>molecules</strong> (search field = input + button) → <strong>organisms</strong> (header) → <strong>templates</strong> → <strong>pages</strong>.</p>
<p>Build components with <strong>variants</strong> for their states and sizes, and <strong>properties</strong> for text, icons and toggles, so one component covers every case.</p>`,
   keys:["Tokens name decisions by purpose.","Atoms → molecules → organisms → templates → pages.","One component, many variants."],
   practice:`<p>In Figma, create color and spacing variables from your palette and 8-point scale. Build a Button component with variants: primary/secondary × default/hover/disabled × small/large.</p>`,
   quiz:[{q:"Why name a token 'color.text.primary' instead of 'gray-900'?",o:["It is shorter","Purpose names survive theme changes like dark mode","Figma requires it","It loads faster"],a:1,w:"The value can change per theme while the meaning stays fixed."}],
   res:[["Brad Frost, Atomic Design","https://atomicdesign.bradfrost.com/"],["Figma: Guide to variables","https://help.figma.com/hc/en-us/articles/15339657135383"]]},
 { id:"auto-layout", title:"Auto layout in practice", mins:7,
   body:`<p>Auto layout makes Figma frames behave like real UI: they grow with content, keep spacing and respond to resizing.</p>
<ul><li><strong>Direction:</strong> vertical or horizontal stacking (or wrap).</li>
<li><strong>Gap:</strong> space between children. Use your 8-point values.</li>
<li><strong>Padding:</strong> space inside the frame.</li>
<li><strong>Resizing:</strong> <em>hug</em> contents, <em>fill</em> the container or stay <em>fixed</em>.</li></ul>
<p>Nest auto layout frames: a card is a vertical stack containing a horizontal header row. When you can type a longer title and everything reflows correctly, your structure is right.</p>
<p>This maps closely to CSS flexbox, which makes handoff to developers much smoother.</p>`,
   keys:["Gap between, padding inside.","Hug, fill or fixed.","If content reflows correctly, the structure is right."],
   practice:`<p>Rebuild a recipe card with nested auto layout: image, title, meta row (time · servings), and a button. Stress-test it with a three-line title and a missing image.</p>`,
   quiz:[{q:"Auto layout most closely mirrors which CSS feature?",o:["Floats","Flexbox","Tables","Absolute positioning"],a:1,w:"Direction, gap, padding and alignment map to flexbox."}],
   res:[["Figma: Auto layout guide","https://help.figma.com/hc/en-us/articles/360040451373"]]},
 { id:"handoff", title:"Developer handoff", mins:6,
   body:`<p>Handoff is not a moment; it is a conversation that starts at kickoff. Still, the file you hand over should answer most questions on its own.</p>
<ul><li><strong>Name layers and components</strong> clearly.</li>
<li><strong>Use tokens and styles</strong>, never one-off values.</li>
<li><strong>Annotate behavior</strong>: what happens on tap, what animates, what's truncated, max lengths.</li>
<li><strong>Show every state</strong> from the states lesson.</li>
<li><strong>Specify responsive behavior</strong> at key breakpoints.</li></ul>
<p>Review the build with the engineer before it ships. Small visual bugs are cheap to fix in review and expensive after launch.</p>`,
   keys:["Involve engineers from the start.","Tokens, names, states, annotations.","Do a design QA pass on the build."],
   practice:`<p>Prepare your weekly plan screen for handoff: clean layer names, tokens everywhere, a states section and five behavior annotations. Ask a developer friend what is still unclear.</p>`,
   quiz:[{q:"When should engineers first see the design?",o:["After final polish","At handoff","Early, ideally at kickoff","After launch"],a:2,w:"Early involvement catches feasibility issues while changes are cheap."}],
   res:[["Figma Dev Mode guide","https://help.figma.com/hc/en-us/articles/15023124644247"]]}
]},
{ id:"testing", title:"Prototyping & Testing", blurb:"Make it real enough to test, then watch people use it.", lessons:[
 { id:"prototyping", title:"Prototyping", mins:6,
   body:`<p>A prototype exists to answer a question. Choose the fidelity that answers it fastest.</p>
<ul><li><strong>Paper:</strong> does the flow make sense?</li>
<li><strong>Clickable wireframes:</strong> can people find their way?</li>
<li><strong>High-fidelity:</strong> does the detailed interaction feel right? Does the visual design communicate?</li>
<li><strong>Coded:</strong> does it work with real data, performance and motion?</li></ul>
<p>Write down the question before you build. "Will people understand that swiping a recipe adds it to the plan?" tells you exactly what to prototype, and what not to.</p>`,
   keys:["Every prototype answers a question.","Lowest fidelity that answers it wins.","Write the question first."],
   practice:`<p>Write one question about your weekly plan flow. Build the smallest clickable Figma prototype that answers it, with only the screens needed.</p>`,
   quiz:[{q:"You want to know if the overall flow makes sense. Best first prototype?",o:["Coded app","High-fidelity animations","Paper or low-fi clickable","Marketing video"],a:2,w:"Low fidelity is fastest for flow questions."}],
   res:[["Figma: Prototyping guide","https://help.figma.com/hc/en-us/articles/360040314193"]]},
 { id:"usability-testing", title:"Usability testing", mins:9,
   body:`<p>Usability testing means watching real people try to complete real tasks with your design. Five participants typically uncover most major usability problems in a round.</p>
<h3>Running a session</h3>
<ol><li>Write <strong>task scenarios</strong>, not instructions: "You have chicken and rice at home. Plan tonight's dinner," not "Tap the plus button."</li>
<li>Ask people to <strong>think aloud</strong>.</li>
<li><strong>Don't help.</strong> When they ask "Should I click this?", reply "What would you expect to happen?"</li>
<li>Note where they hesitate, err or give up.</li></ol>
<h3>Afterwards</h3>
<p>Rate issues by severity (critical, major, minor), fix the worst, and test again. Several small rounds beat one big study.</p>`,
   keys:["Five users per round find most big issues.","Scenarios, not instructions.","Don't rescue the participant."],
   practice:`<p>Run a test of your prototype with three people using two task scenarios. Log every issue with severity, then make one revision and test it with one more person.</p>`,
   quiz:[{q:"A participant asks, 'Do I tap here?' Best reply?",o:["Yes","No, the other button","What would you expect to happen if you did?","Let me show you"],a:2,w:"Redirecting keeps the test honest without leading."}],
   res:[["Steve Krug, Rocket Surgery Made Easy","https://sensible.com/rocket-surgery-made-easy/"],["NN/g: Why you only need to test with 5 users","https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/"]]},
 { id:"accessibility", title:"Accessibility", mins:8,
   body:`<p>Accessibility means people with disabilities can use your product. It also makes products better for everyone: captions help in noisy places, big targets help one-handed use.</p>
<h3>WCAG's four principles (POUR)</h3>
<ul><li><strong>Perceivable:</strong> text alternatives, contrast, captions.</li>
<li><strong>Operable:</strong> keyboard access, enough time, no seizure-inducing flashing.</li>
<li><strong>Understandable:</strong> clear language, predictable behavior, helpful errors.</li>
<li><strong>Robust:</strong> works with assistive tech like screen readers.</li></ul>
<h3>Designer's checklist</h3>
<p>Contrast passes AA · touch targets at least 44×44 pt (Apple) or 48×48 dp (Android) · visible focus states · labels on every input (not placeholder-only) · logical reading and focus order · no information in color alone.</p>`,
   keys:["POUR: Perceivable, Operable, Understandable, Robust.","Targets ≥ 44 pt / 48 dp.","Visible focus and real labels."],
   practice:`<p>Audit your weekly plan screen with the checklist. Fix every failure, then try navigating a website you use with only the keyboard for five minutes and note what breaks.</p>`,
   quiz:[{q:"Why are placeholder-only input labels a problem?",o:["They look old-fashioned","They disappear when typing and often fail contrast","Screen readers can't see color","They are slow to load"],a:1,w:"Users lose the label mid-task and contrast is usually too low."}],
   res:[["WCAG 2.2 quick reference","https://www.w3.org/WAI/WCAG22/quickref/"],["A11y Project checklist","https://www.a11yproject.com/checklist/"]]}
]},
{ id:"career", title:"Portfolio & Capstone", blurb:"Turn your work into case studies and prove your skills end to end.", lessons:[
 { id:"case-studies", title:"Writing case studies", mins:8,
   body:`<p>Hiring managers skim. A case study has to show your <strong>thinking</strong> in under two minutes, and your detail for those who keep reading.</p>
<h3>A structure that works</h3>
<ol><li><strong>Summary:</strong> problem, your role, team, timeline, outcome. One screen.</li>
<li><strong>Context and problem:</strong> why it mattered, with evidence.</li>
<li><strong>Process highlights:</strong> two or three key decisions, what you considered, why you chose.</li>
<li><strong>Solution:</strong> final design, shown big.</li>
<li><strong>Outcome:</strong> metrics or test results. What you'd do next.</li></ol>
<p>Show messy work only when it explains a decision. Three deep case studies beat eight shallow ones.</p>`,
   keys:["Lead with a one-screen summary.","Show decisions and trade-offs, not every artifact.","Three deep projects beat eight shallow ones."],
   practice:`<p>Outline a case study for the meal-planning project you've built across this course using the five-part structure. Write the one-screen summary in full.</p>`,
   quiz:[{q:"What should the first screen of a case study contain?",o:["A mood board","Problem, role, timeline and outcome","Your process diagram","Every sketch"],a:1,w:"A quick summary lets skimmers understand the project immediately."}],
   res:[["Bestfolios: product design portfolios","https://www.bestfolios.com/"]]},
 { id:"critique", title:"Giving and receiving critique", mins:6,
   body:`<p>Critique is how design teams improve work. It is about the work against its goals, never about the person.</p>
<h3>Giving feedback</h3>
<ul><li>Start from the goal: "If the goal is speed, this extra step may slow people down."</li>
<li>Be specific and ask questions: "What led you to put filters behind a menu?"</li>
<li>Separate <strong>reactions</strong> ("I'm confused here") from <strong>directions</strong> ("try a stepper").</li></ul>
<h3>Receiving feedback</h3>
<ul><li>State what kind of feedback you need and at what fidelity.</li>
<li>Listen, write it down, ask clarifying questions. Don't defend in the moment.</li>
<li>You decide what to act on; you owe a reason for what you don't.</li></ul>`,
   keys:["Critique the work against its goals.","Ask before you prescribe.","Say what feedback you need."],
   practice:`<p>Share your weekly plan screen with someone. Tell them the goal and the feedback you want. Log every comment, then write which ones you'll act on and why.</p>`,
   quiz:[{q:"Which is the most useful critique?",o:["I don't like it","Make it pop","Since the goal is quick planning, the three-step add flow may slow people down. Could it be one step?","Use blue"],a:2,w:"It ties the comment to the goal and invites a solution."}],
   res:[["Adam Connor & Aaron Irizarry, Discussing Design (O'Reilly)","https://www.oreilly.com/library/view/discussing-design/9781491902394/"]]},
 { id:"capstone", title:"Capstone project", mins:5,
   body:`<p>Bring everything together in one end-to-end project. You have been building toward this with the meal-planning exercises; now either finish that or pick a new problem you care about.</p>
<h3>Deliverables</h3>
<ol><li>Research plan, 5 interviews and an affinity map with 3 insights.</li>
<li>Problem statement, HMWs and a HEART metric with a guardrail.</li>
<li>Sitemap and one core user flow with unhappy paths.</li>
<li>Wireframes → high-fidelity screens using a small design system (tokens, 5+ components).</li>
<li>Prototype, a 5-person usability test and one revision round.</li>
<li>Accessibility audit.</li>
<li>A case study written with the structure from this module.</li></ol>
<p>Plan for 4–6 weeks at a few hours a week. Use the notes box on each lesson to collect links and decisions as you go.</p>`,
   keys:["One problem, end to end.","Evidence at every step.","Finish with a case study."],
   practice:`<p>Choose your capstone problem and write a one-page brief: who, problem, why now, success metric, timeline. Put the link in your notes below.</p>`,
   quiz:[{q:"Which deliverable proves your design works for people?",o:["Mood board","Usability test with revisions","Logo","Color palette"],a:1,w:"Testing with real people and iterating is the evidence."}],
   res:[["Daily UI challenges for extra reps","https://www.dailyui.co/"]]}
]}
];

/* ───────── Reference images (generated with Codex image_gen) ───────── */
const IMAGES = {
 "what-is-product-design":["Product design sits where valuable, viable and feasible overlap.","The core loop every designer repeats."],
 "double-diamond":["The Double Diamond: discover, define, develop, deliver.","Diverge to see many options, then converge on one decision."],
 "tools-of-the-trade":["A typical setup: paper sketches first, then the design tool.","Learn Figma features in this order."],
 "user-interviews":["An interview: one person asks and listens, the other tells stories.","Questions to avoid and questions to ask."],
 "personas-jtbd":["A persona built from research, keeping only decision-changing details.","The job story format with a worked example."],
 "synthesis":["An affinity map: stickies grouped bottom-up under statement headers.","Observation plus why it matters equals an insight."],
 "problem-statements":["The three parts of a problem statement.","Scoping How Might We questions."],
 "metrics":["Google's HEART framework.","Goal, signal and metric, plus a guardrail."],
 "prioritization":["The impact/effort matrix.","RICE with a worked example."],
 "information-architecture":["A sitemap for the meal-planning app.","An open card sort in progress."],
 "user-flows":["A user flow with an unhappy path.","A journey map with its emotion curve."],
 "wireframing":["The same screen at three fidelities.","Crazy 8s: eight ideas in eight minutes."],
 "laws-of-ux":["Fitts's law: distance and target size.","Hick's law: more choices, slower decisions."],
 "affordance-feedback":["Signifiers tell you how to use a door.","A button's feedback states."],
 "ui-states":["Six states every screen needs.","Interactive states of a text input."],
 "typography":["A type scale with base 16 and ratio 1.25.","Line length: aim for 45–75 characters."],
 "color":["A UI palette: neutrals, primary and semantic colors.","The 60-30-10 rule and WCAG AA contrast thresholds."],
 "layout-spacing":["A card redlined on the 8-point scale.","12, 8 and 4 column grids."],
 "components-tokens":["Atomic design, from atoms to pages.","Three tiers of design tokens."],
 "auto-layout":["Auto layout properties on a card.","Hug, fill and fixed sizing."],
 "handoff":["An annotated screen ready for handoff.","Design QA: designer and developer review the build together."],
 "prototyping":["Prototype fidelity: realism versus speed.","Screens linked into a clickable prototype."],
 "usability-testing":["A usability test session.","Problems found versus number of test users."],
 "accessibility":["WCAG's four POUR principles.","Minimum touch targets and visible focus."],
 "case-studies":["Case study structure.","A portfolio on laptop and phone."],
 "critique":["A design critique session.","Unhelpful versus helpful feedback."],
 "capstone":["A six-week capstone roadmap.","Example of finished capstone screens."]
};
/* Only images that passed review are listed here; the rest are still to be generated. */
const READY = new Set("auto-layout-2,case-studies-1,case-studies-2,color-1,components-tokens-1,components-tokens-2,double-diamond-1,double-diamond-2,information-architecture-1,information-architecture-2,laws-of-ux-1,metrics-1,personas-jtbd-1,personas-jtbd-2,problem-statements-1,problem-statements-2,prototyping-1,prototyping-2,synthesis-1,synthesis-2,tools-of-the-trade-1,tools-of-the-trade-2,typography-1,typography-2,user-interviews-1,user-interviews-2,what-is-product-design-1,what-is-product-design-2".split(","));
const imgsFor = id => (IMAGES[id]||[]).map((cap,i)=>({key:`${id}-${i+1}`, src:`images/${id}-${i+1}.webp`, cap, n:i+1})).filter(im=>READY.has(im.key));
const figure = (im,label) => `<figure class="fig"><button type="button" data-zoom="${im.src}" data-cap="${esc(im.cap)}" aria-label="Enlarge image: ${esc(im.cap)}"><img src="${im.src}" alt="${esc(im.cap)}" loading="lazy" width="1672" height="941"></button><figcaption><span class="mono">${label}</span><span>${esc(im.cap)}</span></figcaption></figure>`;

/* ───────── Derived lookups ───────── */
const ALL = [];
COURSE.forEach((m,mi)=>m.lessons.forEach((l,li)=>ALL.push({...l, m, mi, li})));
const byId = Object.fromEntries(ALL.map(l=>[l.id,l]));
const pad = n=>String(n).padStart(2,"0");

/* ───────── Progress store: account (db) with browser fallback ───────── */
let state = {done:{}, practice:{}, quiz:{}, notes:{}, last:null};
let docRef = null, saveTimer = null, saving = Promise.resolve();
const LS = "redline-progress-v1";
function readLocal(){ try{ const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null }catch(e){ return null } }
function writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)) }catch(e){} }
function merge(d){ if(!d) return; for(const k of ["done","practice","quiz","notes"]) state[k] = {...state[k], ...(d[k]||{})}; if(d.last) state.last = d.last }
merge(readLocal());

function save(){
  writeLocal();
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const body = JSON.parse(JSON.stringify(state));
    saving = saving.then(()=>docRef.set(body)).catch(()=>setSync("Saved in this browser only", false));
  }, 700);
}
let syncLabel = {text:"Saved in this browser", db:false};
function setSync(text, db){ syncLabel = {text, db}; const el = document.getElementById("sync"); if(el){ el.className = "sync mono" + (db?" db":""); el.lastChild.textContent = text } }

async function connect(){
  try{
    const use = window.claude && window.claude.use;
    if(!use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
    if(snap.exists) merge(snap.data());
    docRef = ref;
    setSync("Synced to your account", true);
    save();
    route();
  }catch(e){ /* stay on browser storage */ }
}

/* ───────── Rendering ───────── */
const $main = document.getElementById("main"), $rail = document.getElementById("rail"), $app = document.getElementById("app");
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const doneCount = ()=>ALL.filter(l=>state.done[l.id]).length;
const modDone = m=>m.lessons.filter(l=>state.done[l.id]).length;

function renderRail(current){
  $rail.innerHTML = `
    <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"></span><b>Redline</b></a>
    <div id="sync" class="sync mono${syncLabel.db?" db":""}"><i></i><span>${syncLabel.text}</span></div>
    <a class="navhome" href="#home" ${!current?'aria-current="page"':""}>Overview <span class="mono">${doneCount()}/${ALL.length}</span></a>
    ${COURSE.map((m,mi)=>`<nav class="mod" aria-label="${esc(m.title)}">
      <div class="mod-h"><span>${pad(mi+1)} ${esc(m.title)}</span><span class="mono" style="color:var(--muted)">${modDone(m)}/${m.lessons.length}</span></div>
      ${m.lessons.map(l=>`<a class="lnk${state.done[l.id]?" done":""}" href="#${l.id}" ${current===l.id?'aria-current="page"':""}><span class="dot" aria-hidden="true"></span>${esc(l.title)}</a>`).join("")}
    </nav>`).join("")}`;
}

function nextUp(){
  if(state.last && byId[state.last] && !state.done[state.last]) return byId[state.last];
  return ALL.find(l=>!state.done[l.id]) || null;
}

function renderHome(){
  const d = doneCount(), pct = Math.round(d/ALL.length*100);
  const scores = Object.values(state.quiz).filter(s=>s && s.total);
  const avg = scores.length ? Math.round(scores.reduce((a,s)=>a+s.right/s.total,0)/scores.length*100) : null;
  const prac = Object.values(state.practice).filter(Boolean).length;
  const nx = nextUp();
  const mins = ALL.reduce((a,l)=>a+l.mins,0);
  $main.innerHTML = `<div class="wrap">
    <section class="hero">
      <div class="hero-inner">
        <span class="eyebrow">Self-paced course · ${COURSE.length} modules · ${ALL.length} lessons</span>
        <h1>Learn product design, <em>one decision</em> at a time.</h1>
        <p>From user interviews to a finished case study. Each lesson pairs a short read with a hands-on brief and a quick check, and every brief builds the same capstone project.</p>
        <div class="hero-actions">
          ${nx ? `<a class="btn primary" href="#${nx.id}">${d? "Continue":"Start"}: ${esc(nx.title)} →</a>` : `<a class="btn primary" href="#capstone">Revisit the capstone →</a>`}
          <span class="mono" style="color:var(--muted)">≈ ${Math.round(mins/60*10)/10} h of reading</span>
        </div>
      </div>
      <span class="spec spec-v" aria-hidden="true">64</span>
    </section>

    <section class="ruler" aria-label="Course progress">
      <div class="ruler-top"><span class="eyebrow">Course progress</span><span class="mono">${d} / ${ALL.length} lessons · ${pct}%</span></div>
      <div class="ruler-bar"><div class="ruler-fill" style="width:${pct}%"></div><div class="ruler-ticks"></div></div>
    </section>

    <section class="stats">
      <div class="stat"><b>${d}</b><span>lessons completed</span></div>
      <div class="stat"><b>${prac}</b><span>practice briefs done</span></div>
      <div class="stat"><b>${avg===null?"–":avg+"%"}</b><span>average quiz score</span></div>
    </section>

    <section style="display:flex;flex-direction:column;gap:16px">
      <div class="section-h"><h2>Modules</h2><span class="mono" style="color:var(--muted)">Work in order or jump in</span></div>
      <div class="modgrid">
        ${COURSE.map((m,mi)=>{ const md = modDone(m); const first = m.lessons.find(l=>!state.done[l.id]) || m.lessons[0];
          return `<a class="modcard" href="#${first.id}">
            <span class="eyebrow">Module ${pad(mi+1)}</span>
            <h3>${esc(m.title)}</h3>
            <p>${esc(m.blurb)}</p>
            <div class="pips">${m.lessons.map(l=>`<i class="${state.done[l.id]?"on":""}"></i>`).join("")}</div>
            <div class="modcard-f mono"><span>${md}/${m.lessons.length} done</span><span>${m.lessons.reduce((a,l)=>a+l.mins,0)} min</span></div>
          </a>`}).join("")}
      </div>
    </section>

    <section id="examples" style="display:flex;flex-direction:column;gap:16px">
      <div class="section-h"><h2>Example images</h2><span class="mono" style="color:var(--muted)">${ALL.reduce((a,l)=>a+imgsFor(l.id).length,0)} reference images</span></div>
      ${COURSE.map((m,mi)=>`<div style="display:flex;flex-direction:column;gap:10px">
        <span class="eyebrow">Module ${pad(mi+1)} · ${esc(m.title)}</span>
        <div class="gallery">${m.lessons.flatMap(l=>imgsFor(l.id).map(im=>`<a href="#${l.id}"><img src="${im.src}" alt="${esc(im.cap)}" loading="lazy" width="1672" height="941">${esc(im.cap)}<span>${esc(l.title)}</span></a>`)).join("")}</div>
      </div>`).join("")}
    </section>
  </div>`;
}

function renderLesson(l){
  state.last = l.id; save();
  const idx = ALL.indexOf(l), prev = ALL[idx-1], next = ALL[idx+1];
  const qs = state.quiz[l.id] || {answers:{}};
  const ims = imgsFor(l.id);
  $main.innerHTML = `<div class="wrap">
    <div class="crumb mono"><a href="#home">Overview</a><span>/</span><span>Module ${pad(l.mi+1)} · ${esc(l.m.title)}</span><span>/</span><span>Lesson ${l.li+1} of ${l.m.lessons.length}</span></div>
    <header class="lhead">
      <h1>${esc(l.title)}</h1>
      <div class="lmeta mono"><span>${l.mins} min read</span><span>${l.quiz.length} question${l.quiz.length>1?"s":""}</span>${state.done[l.id]?'<span class="tag">✓ Completed</span>':""}</div>
    </header>

    ${ims.length ? figure(ims[0], "Fig. "+ims[0].n) : ""}

    <article class="prose">${l.body}</article>

    ${ims.length > 1 ? `<section class="figs" aria-label="More reference images">${ims.slice(1).map(im=>figure(im, "Fig. "+im.n)).join("")}</section>` : ""}

    <section class="block" aria-labelledby="k-h"><div class="block-h"><h2 id="k-h">Key ideas</h2></div>
      <ul class="keys">${l.keys.map(k=>`<li><span>${esc(k)}</span></li>`).join("")}</ul></section>

    <section class="block" aria-labelledby="p-h">
      <div class="block-h"><h2 id="p-h">Practice brief</h2><span class="eyebrow">Hands-on</span></div>
      <div class="brief">${l.practice}</div>
      <label class="check" for="prac"><input type="checkbox" id="prac" ${state.practice[l.id]?"checked":""}> I completed this brief</label>
    </section>

    <section class="block" aria-labelledby="q-h">
      <div class="block-h"><h2 id="q-h">Check your understanding</h2><span class="score" id="score"></span></div>
      ${l.quiz.map((q,qi)=>`<div class="q" data-qi="${qi}">
        <div class="q-t">${esc(q.q)}</div>
        <div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[oi]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <p class="why" hidden></p>
      </div>`).join("")}
      <div><button class="btn" id="retry" hidden>Try again</button></div>
    </section>

    <section class="block" aria-labelledby="n-h">
      <div class="block-h"><h2 id="n-h">Your notes</h2><span class="mono" id="nsaved" style="color:var(--muted)"></span></div>
      <textarea id="notes-${l.id}" placeholder="Links to your work, decisions, questions to come back to…">${esc(state.notes[l.id]||"")}</textarea>
    </section>

    <section class="block" aria-labelledby="r-h"><div class="block-h"><h2 id="r-h">Go deeper</h2></div>
      <ul class="res">${l.res.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a><br><span>${esc(new URL(u).hostname.replace(/^www\./,""))}</span></li>`).join("")}</ul></section>

    <nav class="pager" aria-label="Lesson navigation">
      ${prev?`<a href="#${prev.id}"><span class="eyebrow">← Previous</span><b>${esc(prev.title)}</b></a>`:"<span></span>"}
      <button class="btn donebtn${state.done[l.id]?" is-done":""}" id="doneBtn">${state.done[l.id]?"✓ Completed":"Mark complete"}</button>
      ${next?`<a href="#${next.id}"><span class="eyebrow">Next →</span><b>${esc(next.title)}</b></a>`:"<span></span>"}
    </nav>
  </div>`;

  /* quiz */
  const paint = ()=>{
    let answered=0,right=0;
    $main.querySelectorAll(".q").forEach(el=>{
      const qi=+el.dataset.qi, q=l.quiz[qi], pick=qs.answers[qi];
      const why=el.querySelector(".why");
      el.querySelectorAll(".opt").forEach(b=>{ const oi=+b.dataset.oi; b.className="opt"; b.disabled = pick!==undefined;
        if(pick!==undefined){ if(oi===q.a) b.classList.add("right"); else if(oi===pick) b.classList.add("wrong") } });
      if(pick!==undefined){ answered++; if(pick===q.a) right++; why.hidden=false; why.textContent=(pick===q.a?"Correct. ":"Not quite. ")+q.w } else why.hidden=true;
    });
    document.getElementById("score").textContent = answered ? `${right} / ${l.quiz.length} correct` : "";
    document.getElementById("retry").hidden = answered < l.quiz.length;
    if(answered===l.quiz.length){ qs.right=right; qs.total=l.quiz.length }
  };
  $main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const qi=+b.closest(".q").dataset.qi; qs.answers[qi]=+b.dataset.oi; state.quiz[l.id]=qs; paint(); save();
  }));
  document.getElementById("retry").addEventListener("click",()=>{ qs.answers={}; delete qs.right; delete qs.total; state.quiz[l.id]=qs; paint(); save() });
  paint();

  document.getElementById("prac").addEventListener("change",e=>{ state.practice[l.id]=e.target.checked; save() });
  const ta=document.getElementById("notes-"+l.id), ns=document.getElementById("nsaved");
  ta.addEventListener("input",()=>{ state.notes[l.id]=ta.value; ns.textContent="Saving…"; save(); clearTimeout(ta._t); ta._t=setTimeout(()=>ns.textContent="Saved",900) });
  document.getElementById("doneBtn").addEventListener("click",()=>{
    if(state.done[l.id]) delete state.done[l.id]; else state.done[l.id]=Date.now();
    save();
    if(state.done[l.id] && next){ location.hash = next.id } else route();
  });
}

function route(){
  const id = location.hash.slice(1);
  const l = byId[id];
  renderRail(l ? l.id : null);
  if(l) renderLesson(l); else renderHome();
  $app.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false");
}
let lastHash = null;
window.addEventListener("hashchange",()=>{ route(); window.scrollTo(0,0) });
document.getElementById("menuBtn").addEventListener("click",()=>{ const o=$app.classList.toggle("open"); document.getElementById("menuBtn").setAttribute("aria-expanded",String(o)) });
document.getElementById("scrim").addEventListener("click",()=>{ $app.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false") });

const $zoom = document.getElementById("zoom");
$main.addEventListener("click", e=>{
  const b = e.target.closest("[data-zoom]"); if(!b) return;
  $zoom.querySelector("img").src = b.dataset.zoom; $zoom.querySelector("img").alt = b.dataset.cap;
  $zoom.querySelector("span").textContent = b.dataset.cap;
  try{ $zoom.showModal() }catch(err){ $zoom.setAttribute("open","") }
});
$zoom.addEventListener("click", e=>{ if(e.target === $zoom || e.target.closest("button")) $zoom.close() });

route();
connect();
</script>

</body>
</html>
